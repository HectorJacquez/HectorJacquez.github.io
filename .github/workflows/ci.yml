name: Test-first CI

on:
  push:
  pull_request:

jobs:
  test:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run tests (Vitest)
        run: npm run test:run
      - name: Build
        run: npm run build
