<h2 style="font-family:var(--display);margin:2rem 0 .5rem">gpustack</h2>
<figure class="projdiagram" aria-label="Diagram: several stacks share one 12 GB GPU by taking turns through a file lock. One stack holds the lock and its process dies; the next acquirer reads the recorded pid, sees it is dead, breaks the stale lock, and proceeds after the resident stack is unloaded.">
<style>
.projdiagram{margin:2.4rem 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-card);padding:1.1rem 1.1rem .3rem}
.projdiagram svg{display:block;width:100%;height:auto}
.projdiagram figcaption{font-family:var(--mono);font-size:.76rem;letter-spacing:.05em;color:var(--ink-dim);text-align:center;padding:.65rem 0 .8rem}
.projdiagram text{font-family:var(--mono)}
.projdiagram .box{fill:var(--bg-raise);stroke:var(--line);stroke-width:1.2}
.projdiagram .title{fill:var(--ink);font-size:12.5px;font-weight:600;letter-spacing:.04em}
.projdiagram .sub{fill:var(--ink-dim);font-size:10px}
.projdiagram .micro{fill:var(--ink-faint);font-size:8.6px;letter-spacing:.11em}
.projdiagram .wire{fill:none;stroke:var(--line);stroke-width:1.2}
.projdiagram .wait{stroke-dasharray:4 4;opacity:.55}
.projdiagram .g-held{stroke:var(--accent);opacity:.4;stroke-dasharray:4 4}
.projdiagram .g-acq{stroke:var(--accent-2);stroke-width:1.6}
.projdiagram .lockname{fill:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:.05em}
.projdiagram .padlock{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round}
.projdiagram .g-dead{fill:var(--accent-3);font-size:10px;font-weight:600}
.projdiagram .g-stalebadge rect{fill:none;stroke:var(--accent-3);stroke-width:1.2}
.projdiagram .g-stalebadge text{fill:var(--accent-3);font-size:9px;letter-spacing:.08em}
.projdiagram .g-x line{stroke:var(--accent-3);stroke-width:2;stroke-linecap:round}
.projdiagram .g-membar{fill:none;stroke:var(--line);stroke-width:1}
.projdiagram .g-memfill{fill:var(--accent-2);opacity:.5}
.projdiagram .dot{filter:drop-shadow(0 0 3px var(--accent))}

.projdiagram .g-break{fill:var(--accent-2);opacity:0;filter:drop-shadow(0 0 3px var(--accent-2))}

}
@keyframes pd-gpu-hold{0%{offset-distance:0%;opacity:0}3%{opacity:1}14%{offset-distance:100%;opacity:1}16%,100%{offset-distance:100%;opacity:0}}

@media (prefers-reduced-motion:reduce){.projdiagram *{animation:none!important}}
</style>

<h2 style="font-family:var(--display);margin:2rem 0 .5rem">karaoke</h2>
<figure class="projdiagram" aria-label="Diagram of YIN pitch detection: a mic waveform is windowed, then a copy is slid against itself; the lag where the wave best matches itself is one period, so frequency equals one over that period, mapped to the nearest musical note. A caption notes the octave ambiguity at double the period.">
<style>

.projdiagram .title{fill:var(--ink);font-size:12.5px;font-weight:600;letter-spacing:.04em}
.projdiagram .sub{fill:var(--ink-dim);font-size:10px}
.projdiagram .micro{fill:var(--ink-faint);font-size:8.6px;letter-spacing:.11em}
.projdiagram .wire{fill:none;stroke:var(--line);stroke-width:1.2}
.projdiagram .k-mic{fill:none;stroke:var(--ink-dim);stroke-width:1.4}
.projdiagram .k-win{fill:none;stroke:var(--accent-3);stroke-width:1;stroke-dasharray:4 3}
.projdiagram .k-orig{fill:none;stroke:var(--accent);stroke-width:1.8;filter:drop-shadow(0 0 2px var(--accent))}
.projdiagram .k-copy{fill:none;stroke:var(--accent-2);stroke-width:1.6;stroke-dasharray:5 4;transform:translateX(0)}
.projdiagram .k-guide{stroke:var(--accent-3);stroke-width:1;opacity:.9}
.projdiagram .k-brace{stroke:var(--accent);stroke-width:1.2;fill:none}
.projdiagram .k-tau{fill:var(--accent);font-size:11px;font-weight:600}
.projdiagram .resname{fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.04em}
@supports (transform:translateX(1px)){
  .projdiagram .k-copy{animation:pd-yin-slide 9s ease-in-out infinite}
  .projdiagram .k-guide{animation:pd-yin-lock 9s ease-in-out infinite}
}
@keyframes pd-yin-slide{0%,50%{transform:translateX(0)}66%{transform:translateX(34px)}84%,100%{transform:translateX(0)}}
@keyframes pd-yin-lock{0%,50%{opacity:.95}64%,74%{opacity:.14}86%,100%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.projdiagram *{animation:none!important}.projdiagram .k-copy{transform:translateX(0)}.projdiagram .k-guide{opacity:.9}}
</style>
<svg viewBox="0 0 640 332" aria-hidden="true">
  <text class="micro" x="16" y="18">MIC IN  ·  USB MIC ADDS DELAY</text>
  <path class="k-mic" d="M30 46 Q41 37 52 46 Q63 55 74 46 Q85 37 96 46 Q107 55 118 46 Q129 37 140 46 Q151 55 162 46 Q173 37 184 46 Q195 55 206 46 Q217 37 228 46 Q239 55 250 46"/>

  <!-- original vs shifted copy -->
  <path class="k-orig" d="M80 150 Q110 136 140 150 Q170 164 200 150 Q230 136 260 150 Q290 164 320 150 Q350 136 380 150 Q410 164 440 150"/>
  <path class="k-copy" d="M80 206 Q110 192 140 206 Q170 220 200 206 Q230 192 260 206 Q290 220 320 206 Q350 192 380 206 Q410 220 440 206"/>

  <text class="sub" x="446" y="150" fill="var(--accent)">signal</text>
  <text class="sub" x="446" y="210" fill="var(--accent-2)">copy</text>
  <!-- tau brace between consecutive peaks -->
  <path class="k-brace" d="M110 240 V246 H230 V240"/>

  <!-- result -->
  <path class="wire" d="M440 170 C 470 170,470 200,500 200"/>

</figure>

.projdiagram .c-verdict{fill:var(--accent-2);font-size:11px;font-weight:700;letter-spacing:.04em}
@supports (opacity:0){
  .projdiagram .c-onset{animation:pd-chart-tick 6s ease-in-out infinite}

  .projdiagram .c-onset:nth-of-type(4){animation-delay:.9s}
}
@keyframes pd-chart-tick{0%,40%{opacity:.3}55%,80%{opacity:1}95%,100%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.projdiagram *{animation:none!important}.projdiagram .c-onset{opacity:1}}
